name: CI

# Ce poate si ce NU poate dovedi acest workflow:
# poate dovedi ca suita trece, ca imaginea se construieste si ca pluginul de PO
# Token e vazut de yt-dlp. NU poate dovedi ca YouTube ne raspunde: runner-ul
# GitHub e un alt IP de datacenter, la fel de blocat, si nu primeste niciodata
# cookie-urile de producție.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run the whole suite
        # run_all.py ruleaza fiecare fisier in propriul proces si intoarce cod
        # nenul la orice eșec, inclusiv la un test care crapa in loc sa asserte.
        run: python tests/run_all.py

  emulator:
    # Sesiuni de utilizator contra botului REAL, cu Discord si YouTube false.
    # Prinde exact clasa pe care testele unitare nu o vad: butoane care nu mai
    # sunt inregistrate, o sesiune care se blocheaza, un panou care minte, un
    # payload pe care Discord l-ar refuza. Are nevoie de FFmpeg fiindca redarea e
    # reala: cadre Opus adevarate, citite la cadenta de 20ms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run every end-user scenario
        # Fara --real-youtube: runner-ul GitHub e un IP de datacenter, la fel de
        # blocat ca oricare altul, si nu primeste cookie-urile de producție.
        # Latentele false sunt cele masurate in logurile reale.
        run: python -B tools/simulate.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t gogu:ci .
      - name: yt-dlp must see the PO Token plugin
        # Aceeasi verificare pe care o face start.sh la boot, mutata inaintea
        # deploy-ului: cand pluginul nu e vazut, fiecare descarcare da 403 si
        # nimic din loguri nu arata de ce.
        run: |
          docker run --rm --entrypoint bash gogu:ci -c \
            'python -c "from yt_dlp_plugins.extractor import getpot_bgutil; print(\"plugin OK\")"'
      - name: The bundled yt-dlp must be the pinned one
        run: |
          docker run --rm --entrypoint bash gogu:ci -c \
            'python -c "import yt_dlp; print(yt_dlp.version.__version__)"'
      - name: The JS runtimes must be the pinned ones
        # Deno rezolva provocarile JS ale YouTube-ului, Node ruleaza serverul de PO
        # Token: un runtime schimbat pe tacute strica exact descarcarile. Pinurile se
        # citesc din Dockerfile, deci nu exista o a doua copie care sa driftuiasca.
        run: |
          node_want=$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)
          deno_want=$(sed -n 's/^ARG DENO_VERSION=//p' Dockerfile)
          node_have=$(docker run --rm --entrypoint node gogu:ci --version)
          deno_have=$(docker run --rm --entrypoint deno gogu:ci --version | head -1)
          echo "node: ${node_have} (pinuit ${node_want})"
          echo "deno: ${deno_have} (pinuit ${deno_want})"
          test -n "$node_want"
          test -n "$deno_want"
          test "$node_have" = "v${node_want}"
          case "$deno_have" in
            "deno ${deno_want} "*) ;;
            *) echo "Deno din imagine nu e cel pinuit"; exit 1 ;;
          esac
      - name: The PO Token server must start on the bundled Node
        # /health nu depinde de serverul de PO Token (intentionat), deci un Node care
        # nu porneste in imagine ar trece de healthcheck si ar da 403 la fiecare
        # descarcare. Aceeasi proba ca in start.sh.
        run: |
          docker run --rm --entrypoint bash gogu:ci -c '
            node /opt/pot-provider/server/build/main.js --port 4416 > /tmp/pot.log 2>&1 &
            for _ in $(seq 1 60); do
              if curl -fsS --max-time 2 http://127.0.0.1:4416/ping; then exit 0; fi
              sleep 0.5
            done
            cat /tmp/pot.log
            exit 1'
      - name: The whole package must be in the image
        # .dockerignore exclude scratch-ul din radacina (`/_*.py`), iar
        # `music/__init__.py` trebuie sa rămâna.
        run: |
          docker run --rm --entrypoint bash gogu:ci -c \
            'test -f music/__init__.py && DISCORD_TOKEN=x python -c "import bot, music.player; print(\"import OK\")"'
