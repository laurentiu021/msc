name: CI

# Ce poate si ce NU poate dovedi acest workflow:
# poate dovedi ca suita trece, ca imaginea se construieste si ca pluginul de PO
# Token e vazut de yt-dlp. NU poate dovedi ca YouTube ne raspunde: runner-ul
# GitHub e un alt IP de datacenter, la fel de blocat, si nu primeste niciodata
# cookie-urile de producție.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run the whole suite
        # run_all.py ruleaza fiecare fisier in propriul proces si intoarce cod
        # nenul la orice eșec, inclusiv la un test care crapa in loc sa asserte.
        run: python tests/run_all.py

  emulator:
    # Sesiuni de utilizator contra botului REAL, cu Discord si YouTube false.
    # Prinde exact clasa pe care testele unitare nu o vad: butoane care nu mai
    # sunt inregistrate, o sesiune care se blocheaza, un panou care minte, un
    # payload pe care Discord l-ar refuza. Are nevoie de FFmpeg fiindca redarea e
    # reala: cadre Opus adevarate, citite la cadenta de 20ms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run every end-user scenario
        # Fara --real-youtube: runner-ul GitHub e un IP de datacenter, la fel de
        # blocat ca oricare altul, si nu primeste cookie-urile de producție.
        # Latentele false sunt cele masurate in logurile reale.
        run: python -B tools/simulate.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t gogu:ci .
      - name: yt-dlp must see the PO Token plugin
        # Aceeasi verificare pe care o face start.sh la boot, mutata inaintea
        # deploy-ului: cand pluginul nu e vazut, fiecare descarcare da 403 si
        # nimic din loguri nu arata de ce.
        run: |
          docker run --rm --entrypoint bash gogu:ci -c \
            'python -c "from yt_dlp_plugins.extractor import getpot_bgutil; print(\"plugin OK\")"'
      - name: The bundled yt-dlp must be the pinned one
        run: |
          docker run --rm --entrypoint bash gogu:ci -c \
            'python -c "import yt_dlp; print(yt_dlp.version.__version__)"'
